name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: fastapi-k3s

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: [self-hosted, k3s]
    concurrency: deploy-prod
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build image
        run: docker build -t ${IMAGE_NAME}:${TAG} .

      - name: Save and import into k3s containerd
        run: |
          docker save ${IMAGE_NAME}:${TAG} -o ${RUNNER_TEMP}/image.tar
          sudo -n /usr/local/bin/k3s ctr -n k8s.io images import ${RUNNER_TEMP}/image.tar
          rm -f ${RUNNER_TEMP}/image.tar
          sudo -n /usr/local/bin/k3s ctr -n k8s.io images ls | grep ${IMAGE_NAME}:${TAG}

      - name: Render manifests
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE_NAME}:${TAG}|" k8s/deployment.yaml
          sed -i "s|VERSION_PLACEHOLDER|${TAG}|" k8s/deployment.yaml

      - name: Apply and wait for rollout
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/
          kubectl -n fastapi-app rollout status deploy/fastapi --timeout=120s || {
            kubectl -n fastapi-app rollout undo deploy/fastapi
            exit 1
          }

      - name: Clean up old images (keep last 3)
        if: success()
        run: |
          for t in $(docker image ls ${IMAGE_NAME} --format '{{.Tag}}' | tail -n +4); do
            docker rmi ${IMAGE_NAME}:${t} || true
            sudo -n /usr/local/bin/k3s ctr -n k8s.io images rm docker.io/library/${IMAGE_NAME}:${t} || true
          done
          docker image prune -f